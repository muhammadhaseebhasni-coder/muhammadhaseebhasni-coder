<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; font-family: Inter, sans-serif; background: #1a1d24; }
  #c { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  #ov { position: absolute; inset: 0; pointer-events: none; }
  .vig { position: absolute; inset: 0; background: radial-gradient(ellipse 75% 60% at 50% 55%, rgba(0,0,0,0) 55%, rgba(0,0,0,.38) 100%); }
  .banner { position: absolute; left: 0; right: 0; top: 0; height: 330px;
    background: linear-gradient(rgba(11,18,32,.94) 0%, rgba(11,18,32,.80) 70%, rgba(11,18,32,0) 100%); }
  .title { position: absolute; top: 48px; width: 100%; text-align: center; color: #fff; font-weight: 900; font-size: 74px; letter-spacing: 1px; }
  .sub { position: absolute; top: 146px; width: 100%; text-align: center; color: #FBBF24; font-weight: 700; font-size: 31px; letter-spacing: 1px; }
  .pill { position: absolute; top: 218px; left: 50%; transform: translateX(-50%); background: #FBBF24; color: #0B1220;
    font-weight: 900; font-size: 30px; letter-spacing: 3px; padding: 7px 34px; border-radius: 30px; white-space: nowrap; }
  .tag { position: absolute; transform: translate(-50%, -50%); background: rgba(15,23,42,.88); color: #fff; font-weight: 800;
    font-size: 25px; letter-spacing: .5px; padding: 8px 18px; border-radius: 999px; white-space: nowrap; border: 2px solid rgba(251,191,36,.95); }
  .tag small { color: #FBBF24; font-weight: 700; margin-left: 8px; font-size: 22px; }
  .foot { position: absolute; bottom: 0; left: 0; right: 0; height: 70px; background: rgba(11,18,32,.75); color: #CBD5E1;
    font-size: 22px; font-weight: 500; text-align: center; line-height: 70px; }
  .divider { position: absolute; top: 330px; bottom: 70px; width: 6px; margin-left: -3px; background: #fff; box-shadow: 0 0 18px rgba(0,0,0,.6); }
  .handle { position: absolute; top: 50%; left: 50%; width: 84px; height: 84px; margin: -42px 0 0 -42px; border-radius: 50%;
    background: #fff; box-shadow: 0 6px 20px rgba(0,0,0,.5); color: #0B1220; font-weight: 900; font-size: 40px; line-height: 80px; text-align: center; }
  .side { position: absolute; bottom: 120px; font-weight: 900; font-size: 34px; letter-spacing: 3px; padding: 10px 26px; border-radius: 30px; }
  .end { position: absolute; left: 60px; right: 60px; bottom: 120px; background: rgba(11,18,32,.93); border-radius: 30px;
    padding: 40px 30px 46px; text-align: center; }
  .end .l1 { color: #FBBF24; font-weight: 900; font-size: 44px; letter-spacing: 2px; }
  .end .l2 { color: #fff; font-weight: 700; font-size: 36px; margin-top: 18px; }
  .end .btn { display: inline-block; margin-top: 30px; background: #DC2626; color: #fff; font-weight: 900; font-size: 36px;
    letter-spacing: 2px; padding: 24px 50px; border-radius: 60px; }
</style>
<script>/*THREE*/</script>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div id="ov"></div>
<script>
THREE.ColorManagement.legacyMode = false;
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const prog = (t, a, d) => clamp((t - a) / d);
const eo = x => 1 - Math.pow(1 - x, 3);
const eio = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eob = (x, c1 = 1.0) => { const c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const lerp = (a, b, k) => a + (b - a) * k;

// ---------- renderer ----------
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("c"), antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(1080, 1920, false);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
const scene = new THREE.Scene();
scene.background = new THREE.Color("#1a1d24");
const camera = new THREE.PerspectiveCamera(42, 1080 / 1920, 0.2, 200);

// image-based lighting from a simple procedural "room" (soft ceiling panels + warm window) -> realistic ambient & reflections
(function buildEnvironment() {
  const env = new THREE.Scene();
  const boxGeo = new THREE.BoxGeometry(1, 1, 1);
  const shell = new THREE.Mesh(boxGeo, new THREE.MeshBasicMaterial({ color: "#8c8579", side: THREE.BackSide }));
  shell.scale.set(30, 14, 30); shell.position.y = 6; env.add(shell);
  const floorM = new THREE.Mesh(boxGeo, new THREE.MeshBasicMaterial({ color: "#6b5640" })); floorM.scale.set(30, 0.1, 30); floorM.position.y = -0.9; env.add(floorM);
  const panel = (c, x, y, z, sx, sy, sz) => { const m = new THREE.Mesh(boxGeo, new THREE.MeshBasicMaterial({ color: c })); m.position.set(x, y, z); m.scale.set(sx, sy, sz); env.add(m); };
  panel(new THREE.Color(5, 4.8, 4.4), 0, 12.9, 0, 10, 0.1, 10);       // ceiling softbox
  panel(new THREE.Color(7, 6.4, 5.4), 14.9, 6, 4, 0.1, 6, 8);         // warm window (right)
  panel(new THREE.Color(2.2, 2.4, 2.8), -6, 6, 14.9, 8, 5, 0.1);      // cool fill (front)
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(env, 0.04).texture;
})();

const hemi = new THREE.HemisphereLight(0xffffff, 0x8a7a68, 0.35); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffe9cc, 1.6);
sun.position.set(16, 17, 9); sun.target.position.set(3, 0, 2.5); scene.add(sun, sun.target);
sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -10, right: 10, top: 10, bottom: -10, near: 1, far: 60 });
sun.shadow.bias = -0.0003; sun.shadow.normalBias = 0.015;

// ---------- helpers given to designs ----------
let seed = 11;
const rand = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
function canvasTex(w, h, draw, repeat, srgb = true) {
  const c = document.createElement("canvas"); c.width = w; c.height = h; draw(c.getContext("2d"), w, h);
  const tx = new THREE.CanvasTexture(c); if (srgb) tx.encoding = THREE.sRGBEncoding; tx.anisotropy = 8;
  tx.wrapS = tx.wrapT = THREE.RepeatWrapping; if (repeat) tx.repeat.set(repeat[0], repeat[1]);
  return tx;
}
function noiseTex(size, base, amp, blobs) {
  return canvasTex(size, size, (g, w) => {
    g.fillStyle = base; g.fillRect(0, 0, w, w);
    for (let i = 0; i < blobs; i++) {
      const v = Math.floor(128 + (rand() - 0.5) * amp);
      g.fillStyle = `rgba(${v},${v},${v},${0.08 + rand() * 0.12})`;
      const r = 1 + rand() * 3; g.fillRect(rand() * w, rand() * w, r, r);
    }
  }, null, false);
}
function woodCanvas(g, w, h, base, dark, light) {
  g.fillStyle = base; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 26; i++) { g.fillStyle = (rand() < 0.5 ? dark : light); g.globalAlpha = 0.04 + rand() * 0.06; g.fillRect(0, rand() * h, w, 6 + rand() * 30); }
  for (let i = 0; i < 160; i++) {
    const y0 = rand() * h, amp = 1 + rand() * 7, f = 0.002 + rand() * 0.006, ph = rand() * 9;
    g.strokeStyle = dark; g.globalAlpha = 0.04 + rand() * 0.14; g.lineWidth = 0.6 + rand() * 1.8;
    g.beginPath(); for (let x = 0; x <= w; x += 10) g.lineTo(x, y0 + Math.sin(x * f + ph) * amp + Math.sin(x * f * 3.1) * amp * 0.3); g.stroke();
  }
  g.globalAlpha = 1;
}
const materials = new Set();
function track(m) { materials.add(m); return m; }
const matCache = {};
const H = {
  rand, canvasTex, curObj: "",
  mat(c, extra) { const k = c + JSON.stringify(extra || {}); return matCache[k] || (matCache[k] = track(new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: 0.6 }, extra || {})))); },
  phys(c, extra) { const k = "p" + c + JSON.stringify(extra || {}); return matCache[k] || (matCache[k] = track(new THREE.MeshPhysicalMaterial(Object.assign({ color: c, roughness: 0.5 }, extra || {})))); },
  // wood: texture tiles every `tile` feet (rbox UVs are in feet); `boxTile` for plain boxes (UV 0..1 per face)
  wood(base = "#C8A274", opts = {}) {
    const k = "wood" + base + JSON.stringify(opts);
    if (matCache[k]) return matCache[k];
    const dark = opts.dark || "#6e4724", light = opts.light || "#e6c79c";
    const mapC = document.createElement("canvas"); mapC.width = mapC.height = 1024; woodCanvas(mapC.getContext("2d"), 1024, 1024, base, dark, light);
    const map = new THREE.CanvasTexture(mapC); map.encoding = THREE.sRGBEncoding; map.wrapS = map.wrapT = THREE.RepeatWrapping; map.anisotropy = 8;
    const bump = new THREE.CanvasTexture(mapC); bump.wrapS = bump.wrapT = THREE.RepeatWrapping;
    const rep = opts.box ? [1, 1] : [1 / (opts.tile || 3), 1 / (opts.tile || 3)];
    map.repeat.set(rep[0], rep[1]); bump.repeat.set(rep[0], rep[1]);
    if (opts.rot) { map.rotation = bump.rotation = opts.rot; }
    const m = new THREE.MeshPhysicalMaterial({ map, bumpMap: bump, bumpScale: 0.004, roughness: opts.roughness || 0.5, clearcoat: opts.clearcoat || 0.15, clearcoatRoughness: 0.35 });
    return (matCache[k] = track(m));
  },
  fabric(c) {
    const k = "fab" + c; if (matCache[k]) return matCache[k];
    const bump = canvasTex(256, 256, (g, w) => { g.fillStyle = "#808080"; g.fillRect(0, 0, w, w); for (let y = 0; y < w; y += 4) for (let x = 0; x < w; x += 4) { const v = 100 + ((x + y) / 4 % 2) * 60 + rand() * 30; g.fillStyle = `rgb(${v},${v},${v})`; g.fillRect(x, y, 3, 3); } }, [6, 6], false);
    return (matCache[k] = track(new THREE.MeshPhysicalMaterial({ color: c, roughness: 0.95, bumpMap: bump, bumpScale: 0.01, sheen: 0.35, sheenRoughness: 0.8, sheenColor: new THREE.Color("#777777") })));
  },
  glows: [], lights: [], emissives: [],

  mark(mesh, o) { mesh.castShadow = !(o && o.cast === false); mesh.receiveShadow = true; mesh.userData.obj = (o && o.obj) || H.curObj; if (o && o.noCheck) mesh.userData.noCheck = true; return mesh; },
  box(g, x1, x2, y1, y2, z1, z2, m, o) {
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(Math.max(x2 - x1, 0.004), Math.max(y2 - y1, 0.004), Math.max(z2 - z1, 0.004)), m);
    mesh.position.set((x1 + x2) / 2, (y1 + y2) / 2, (z1 + z2) / 2);
    H.mark(mesh, o); mesh.userData.y0 = mesh.position.y; mesh.userData.h = y2 - y1; g.add(mesh); return mesh;
  },
  // rounded-edge box (bevelled extrusion), same arguments as box + radius
  rbox(g, x1, x2, y1, y2, z1, z2, m, r = 0.03, o) {
    const w = x2 - x1, h = y2 - y1, d = z2 - z1;
    r = Math.max(0.002, Math.min(r, w / 2 - 0.002, h / 2 - 0.002, d / 2 - 0.002));
    const iw = w - 2 * r, id = d - 2 * r, rho = r * 0.05;
    const s = new THREE.Shape();
    s.moveTo(-iw / 2 + rho, -id / 2); s.lineTo(iw / 2 - rho, -id / 2); s.absarc(iw / 2 - rho, -id / 2 + rho, rho, -Math.PI / 2, 0);
    s.lineTo(iw / 2, id / 2 - rho); s.absarc(iw / 2 - rho, id / 2 - rho, rho, 0, Math.PI / 2);
    s.lineTo(-iw / 2 + rho, id / 2); s.absarc(-iw / 2 + rho, id / 2 - rho, rho, Math.PI / 2, Math.PI);
    s.lineTo(-iw / 2, -id / 2 + rho); s.absarc(-iw / 2 + rho, -id / 2 + rho, rho, Math.PI, Math.PI * 1.5);
    const depth = Math.max(h - 2 * r, 0.001);
    const geo = new THREE.ExtrudeGeometry(s, { depth, bevelEnabled: true, bevelThickness: r, bevelSize: r, bevelSegments: 3, curveSegments: 3 });
    geo.rotateX(-Math.PI / 2); geo.translate(0, -depth / 2, 0); geo.computeVertexNormals();
    const mesh = new THREE.Mesh(geo, m);
    mesh.position.set((x1 + x2) / 2, (y1 + y2) / 2, (z1 + z2) / 2);
    H.mark(mesh, o); mesh.userData.y0 = mesh.position.y; mesh.userData.h = h; g.add(mesh); return mesh;
  },
  cyl(g, x, y, z, r, h, m, o = {}) {
    const mesh = new THREE.Mesh(new THREE.CylinderGeometry(o.rTop !== undefined ? o.rTop : r, r, h, o.seg || 36, 1, !!o.open), m);
    if (o.axis === "x") { mesh.rotation.z = Math.PI / 2; mesh.position.set(x, y, z); }
    else if (o.axis === "z") { mesh.rotation.x = Math.PI / 2; mesh.position.set(x, y, z); }
    else mesh.position.set(x, y + h / 2, z);
    H.mark(mesh, o); g.add(mesh); return mesh;
  },
  sph(g, x, y, z, r, m, scale = [1, 1, 1], o) {
    const mesh = new THREE.Mesh(new THREE.SphereGeometry(r, 28, 20), m);
    mesh.position.set(x, y, z); mesh.scale.set(...scale); H.mark(mesh, o); g.add(mesh); return mesh;
  },
  torus(g, x, y, z, R, r, m, rot = [0, 0, 0], o) {
    const mesh = new THREE.Mesh(new THREE.TorusGeometry(R, r, 12, 40), m);
    mesh.position.set(x, y, z); mesh.rotation.set(...rot); H.mark(mesh, o); g.add(mesh); return mesh;
  },
  plane(g, w, h, m, pos, rot, o) {
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), m);
    mesh.position.set(...pos); mesh.rotation.set(...(rot || [0, 0, 0])); H.mark(mesh, Object.assign({ cast: false }, o)); g.add(mesh); return mesh;
  },
  // ---- soft contact shadow / ambient occlusion decals ----
  aoTex: canvasTex(128, 128, (g, w) => {
    const gr = g.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2);
    gr.addColorStop(0, "rgba(0,0,0,1)"); gr.addColorStop(0.5, "rgba(0,0,0,.55)"); gr.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = gr; g.fillRect(0, 0, w, w);
  }, null, false),
  aoLinTex: canvasTex(16, 128, (g, w, h) => {
    const gr = g.createLinearGradient(0, h, 0, 0); gr.addColorStop(0, "rgba(0,0,0,1)"); gr.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
  }, null, false),
  contact(g, x, z, sx, sz, strength = 0.5, y = 0.003) {
    const m = new THREE.MeshBasicMaterial({ map: H.aoTex, transparent: true, opacity: strength, depthWrite: false });
    return H.plane(g, sx, sz, m, [x, y, z], [-Math.PI / 2, 0, 0], { noCheck: true });
  },
  // ---- night-time glow ----
  glowTex: canvasTex(128, 128, (g, w) => {
    const gr = g.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2);
    gr.addColorStop(0, "rgba(255,255,255,1)"); gr.addColorStop(0.25, "rgba(255,255,255,.5)"); gr.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = gr; g.fillRect(0, 0, w, w);
  }),
  glow(g, x, y, z, size, color, strength = 0.9) {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: H.glowTex, color, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, opacity: 0 }));
    s.position.set(x, y, z); s.scale.set(size, size, 1); s.userData.strength = strength; g.add(s); H.glows.push(s); return s;
  },
  glowLine(g, a, b, n, size, color, strength) {
    for (let i = 0; i <= n; i++) { const k = i / n; H.glow(g, lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k), size, color, strength); }
  },
  led(color, day = 0.4, night = 2.2) { const m = track(new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: day })); m.userData = { day, night }; H.emissives.push(m); return m; },
  light(x, y, z, color, intensity, distance) { const l = new THREE.PointLight(color, 0, distance, 2); l.position.set(x, y, z); l.userData.max = intensity; scene.add(l); H.lights.push(l); return l; },
  // ---- plants ----
  leafMat(c1, c2, kind) {
    const k = "leaf" + c1 + kind; if (matCache[k]) return matCache[k];
    const map = canvasTex(128, 256, (g, w, h) => {
      g.clearRect(0, 0, w, h);
      const gr = g.createLinearGradient(0, 0, w, 0); gr.addColorStop(0, c2); gr.addColorStop(0.5, c1); gr.addColorStop(1, c2);
      g.fillStyle = gr; g.beginPath();
      if (kind === "blade") { g.moveTo(w * 0.5, 0); g.quadraticCurveTo(w * 0.98, h * 0.35, w * 0.8, h); g.lineTo(w * 0.2, h); g.quadraticCurveTo(w * 0.02, h * 0.35, w * 0.5, 0); }
      else { g.moveTo(w / 2, 4); g.bezierCurveTo(w * 1.05, h * 0.25, w * 0.95, h * 0.8, w / 2, h - 4); g.bezierCurveTo(w * 0.05, h * 0.8, -w * 0.05, h * 0.25, w / 2, 4); }
      g.fill();
      if (kind === "blade") { g.globalAlpha = 0.35; g.fillStyle = "#1f3d14"; for (let y = 10; y < h; y += 14 + rand() * 10) { g.beginPath(); g.ellipse(w / 2, y, w * 0.32, 3, 0, 0, Math.PI * 2); g.fill(); } g.globalAlpha = 1; g.strokeStyle = "#c9c25a"; g.lineWidth = 3; g.beginPath(); g.moveTo(w * 0.5, 0); g.quadraticCurveTo(w * 0.98, h * 0.35, w * 0.8, h); g.moveTo(w * 0.5, 0); g.quadraticCurveTo(w * 0.02, h * 0.35, w * 0.2, h); g.stroke(); }
      else { g.strokeStyle = "rgba(220,240,200,.55)"; g.lineWidth = 2.5; g.beginPath(); g.moveTo(w / 2, 6); g.lineTo(w / 2, h - 6); g.stroke(); }
    });
    return (matCache[k] = track(new THREE.MeshStandardMaterial({ map, alphaTest: 0.5, side: THREE.DoubleSide, roughness: 0.55 })));
  },
  // bushy potted plant: leaves stay inside a cylinder of radius `spread` and height `height` above the pot rim
  pottedPlant(g, x, y, z, o = {}) {
    const potR = o.potR || 0.3, potH = o.potH || 0.5, spread = o.spread || 0.45, height = o.height || 0.6, n = o.leaves || 26;
    H.cyl(g, x, y, z, potR * 0.82, potH, o.potMat || H.phys(o.pot || "#f2efe9", { roughness: 0.35, clearcoat: 0.4 }), { rTop: potR });
    H.cyl(g, x, y + potH - 0.04, z, potR * 0.95, 0.03, H.mat("#3b2a1d", { roughness: 1 }), { cast: false });
    const lm = H.leafMat("#4f8a2b", "#2f5e1a", "leaf"), size = o.leafSize || 0.22;
    for (let i = 0; i < n; i++) {
      const a = rand() * Math.PI * 2, rr = (0.25 + rand() * 0.75) * (spread - size * 0.6), hh = (0.25 + rand() * 0.75) * (height - size);
      const leaf = new THREE.Mesh(new THREE.PlaneGeometry(size * 0.55, size), lm);
      leaf.position.set(x + Math.cos(a) * rr, y + potH + hh + size * 0.35, z + Math.sin(a) * rr);
      leaf.rotation.set(-0.6 - rand() * 0.6, -a + Math.PI / 2, (rand() - 0.5) * 0.6, "YXZ");
      H.mark(leaf, o); g.add(leaf);
    }
  },
  snakePlant(g, x, y, z, o = {}) {
    const potR = o.potR || 0.5, potH = o.potH || 1.0, height = o.height || 3.0, n = o.blades || 11;
    H.cyl(g, x, y, z, potR * 0.85, potH, H.phys(o.pot || "#e8e2d8", { roughness: 0.4, clearcoat: 0.3 }), { rTop: potR });
    H.cyl(g, x, y + potH - 0.05, z, potR * 0.95, 0.03, H.mat("#3b2a1d", { roughness: 1 }), { cast: false });
    const lm = H.leafMat("#3c6b2a", "#24451a", "blade");
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + rand() * 0.4, rr = rand() * potR * 0.45, hh = height * (0.65 + rand() * 0.35), w = 0.22 + rand() * 0.1;
      const blade = new THREE.Mesh(new THREE.PlaneGeometry(w, hh), lm);
      blade.position.set(x + Math.cos(a) * rr, y + potH + hh / 2 - 0.05, z + Math.sin(a) * rr);
      blade.rotation.set((rand() - 0.5) * 0.18, -a, (rand() - 0.5) * 0.18, "YXZ");
      H.mark(blade, o); g.add(blade);
    }
  },
  // ---- books with printed spines ----
  bookMats(color) {
    const k = "book" + color; if (matCache[k]) return matCache[k];
    const spine = canvasTex(64, 256, (g, w, h) => {
      g.fillStyle = color; g.fillRect(0, 0, w, h);
      g.fillStyle = "rgba(255,255,255,.08)"; g.fillRect(0, 0, w * 0.25, h);
      g.fillStyle = "rgba(0,0,0,.12)"; g.fillRect(w * 0.8, 0, w * 0.2, h);
      const ink = rand() < 0.5 ? "rgba(240,220,160,.9)" : "rgba(255,255,255,.85)";
      g.fillStyle = ink; g.fillRect(w * 0.2, h * 0.08, w * 0.6, 4); g.fillRect(w * 0.2, h * 0.9, w * 0.6, 4);
      for (let i = 0; i < 5; i++) g.fillRect(w * 0.3, h * (0.3 + i * 0.07), w * 0.4, 6);
    });
    const cover = H.mat(color, { roughness: 0.6 }), pages = H.mat("#efe7d4", { roughness: 0.9 });
    const sp = track(new THREE.MeshStandardMaterial({ map: spine, roughness: 0.55 }));
    return (matCache[k] = { cover, pages, spine: sp });
  },
  // a row of upright books from `start` along axis ("x" or "z"); spines face +z (axis x) or +x (axis z)
  books(g, axis, start, end, base, back, depth, maxH, palette) {
    let p = start;
    while (true) {
      const th = 0.08 + rand() * 0.08, h = maxH * (0.72 + rand() * 0.28), d = depth * (0.85 + rand() * 0.15);
      if (p + th > end) break;
      const bm = H.bookMats(palette[Math.floor(rand() * palette.length)]);
      let mesh;
      if (axis === "x") {
        mesh = H.box(g, p, p + th, base, base + h, back, back + d, [bm.cover, bm.cover, bm.pages, bm.pages, bm.spine, bm.pages]);
      } else {
        mesh = H.box(g, back, back + d, base, base + h, p, p + th, [bm.spine, bm.pages, bm.pages, bm.pages, bm.cover, bm.cover]);
      }
      p += th + 0.008;
    }
    return p;
  }
};
</script>
<script>/*DESIGN*/</script>
<script>
const D = window.CORNER;
const ROOM = Object.assign({ wall: "#ECE7E0", size: 16, height: 11 }, D.room || {});

// ---------- room ----------
const room = new THREE.Group(); scene.add(room);
H.curObj = "room";
const floorC = document.createElement("canvas"); floorC.width = floorC.height = 1024;
(function drawFloor(g, w, h) {
  const rows = 10, rh = h / rows;
  for (let r = 0; r < rows; r++) {
    let x = -rand() * 500;
    while (x < w) {
      const len = 300 + rand() * 360, tone = rand();
      const c = [Math.round(190 + tone * 25), Math.round(152 + tone * 22), Math.round(108 + tone * 20)];
      g.fillStyle = `rgb(${c})`; g.fillRect(x, r * rh, len, rh);
      for (let k = 0; k < 14; k++) { g.strokeStyle = `rgba(105,70,38,${0.05 + rand() * 0.1})`; g.lineWidth = 1 + rand() * 1.5; g.beginPath(); const yy = r * rh + rand() * rh; g.moveTo(x, yy); g.bezierCurveTo(x + len * 0.3, yy + (rand() - 0.5) * 8, x + len * 0.7, yy + (rand() - 0.5) * 8, x + len, yy + (rand() - 0.5) * 6); g.stroke(); }
      g.fillStyle = "rgba(70,45,22,.55)"; g.fillRect(x, r * rh, 2, rh); g.fillRect(x, r * rh, len, 1.5);
      x += len;
    }
  }
})(floorC.getContext("2d"), 1024, 1024);
const floorMap = new THREE.CanvasTexture(floorC); floorMap.encoding = THREE.sRGBEncoding; floorMap.wrapS = floorMap.wrapT = THREE.RepeatWrapping; floorMap.repeat.set(2.4, 2.4); floorMap.anisotropy = 8;
const floorBump = new THREE.CanvasTexture(floorC); floorBump.wrapS = floorBump.wrapT = THREE.RepeatWrapping; floorBump.repeat.set(2.4, 2.4);
const floorMat = track(new THREE.MeshPhysicalMaterial({ map: floorMap, bumpMap: floorBump, bumpScale: 0.003, roughness: 0.42, clearcoat: 0.25, clearcoatRoughness: 0.3 }));
H.box(room, -0.4, ROOM.size, -0.2, 0, -0.4, ROOM.size, floorMat, { cast: false, noCheck: true });
const plaster = noiseTex(512, "#808080", 70, 9000); plaster.repeat.set(3, 3);
const wallMat = track(new THREE.MeshStandardMaterial({ color: ROOM.wall, roughness: 0.92, bumpMap: plaster, bumpScale: 0.004 }));
H.box(room, -0.4, ROOM.size, 0, ROOM.height, -0.4, 0, wallMat, { cast: false, noCheck: true });
H.box(room, -0.4, 0, 0, ROOM.height, 0, ROOM.size, wallMat, { cast: false, noCheck: true });
const trim = H.phys("#fbfaf7", { roughness: 0.35, clearcoat: 0.3 });
H.rbox(room, 0, ROOM.size, 0, 0.32, 0, 0.05, trim, 0.012, { noCheck: true });
H.rbox(room, 0, 0.05, 0, 0.32, 0.05, ROOM.size, trim, 0.012, { noCheck: true });
// fake ambient occlusion where walls meet the floor and each other
const aoLin = new THREE.MeshBasicMaterial({ map: H.aoLinTex, transparent: true, opacity: 0.28, depthWrite: false });
H.plane(room, ROOM.size, 1.2, aoLin, [ROOM.size / 2, 0.6, 0.056], [0, 0, 0], { noCheck: true });
H.plane(room, ROOM.size, 1.2, aoLin, [0.056, 0.6, ROOM.size / 2], [0, Math.PI / 2, 0], { noCheck: true });
const aoFloor = new THREE.MeshBasicMaterial({ map: H.aoLinTex, transparent: true, opacity: 0.22, depthWrite: false });
H.plane(room, ROOM.size, 1.0, aoFloor, [ROOM.size / 2, 0.002, 0.55], [-Math.PI / 2, 0, Math.PI], { noCheck: true });
H.plane(room, 1.0, ROOM.size, new THREE.MeshBasicMaterial({ map: (() => { const t = H.aoLinTex.clone(); t.needsUpdate = true; t.center.set(0.5, 0.5); t.rotation = Math.PI / 2; return t; })(), transparent: true, opacity: 0.22, depthWrite: false }), [0.55, 0.002, ROOM.size / 2], [-Math.PI / 2, 0, 0], { noCheck: true });
const cornerAO = new THREE.MeshBasicMaterial({ map: (() => { const t = H.aoLinTex.clone(); t.needsUpdate = true; t.center.set(0.5, 0.5); t.rotation = -Math.PI / 2; return t; })(), transparent: true, opacity: 0.2, depthWrite: false });
H.plane(room, 0.9, ROOM.height, cornerAO, [0.45, ROOM.height / 2, 0.004], [0, 0, 0], { noCheck: true });
H.plane(room, 0.9, ROOM.height, cornerAO, [0.004, ROOM.height / 2, 0.45], [0, Math.PI / 2, 0], { noCheck: true });

// ---------- items ----------
const items = D.items.map((it, i) => {
  const holder = new THREE.Group(); const inner = new THREE.Group(); holder.add(inner); scene.add(holder);
  H.curObj = it.id || ("item" + i);
  it.build(inner, H);
  return Object.assign({ holder, inner }, it);
});

function applyState(t) {
  for (const it of items) {
    const dur = it.dur || 0.8, p = prog(t, it.at, dur), h = it.holder;
    if (it.beforeOnly) { h.visible = p < 1; const k = Math.max(1 - eo(p), 0.001); h.scale.set(k, k, k); continue; }
    h.visible = p > 0; if (!h.visible) continue;
    h.position.set(0, 0, 0); h.scale.set(1, 1, 1);
    const a = it.anim || "pop";
    if (a === "drop") h.position.y = (1 - eo(p)) * 2.5;
    else if (a === "slide") { const f = it.from || [4, 0, 0], k = 1 - eo(p); h.position.set(f[0] * k, f[1] * k, f[2] * k); }
    else if (a === "sweep") {
      const kids = it.inner.children, n = kids.length;
      kids.forEach((m, j) => {
        const pj = eo(prog(t, it.at + (j / n) * dur * 0.8, dur * 0.25));
        m.visible = pj > 0; m.scale.y = Math.max(pj, 0.001);
        if (m.userData.h !== undefined) m.position.y = m.userData.y0 - m.userData.h / 2 * (1 - pj);
      });
    } else {
      const k = Math.max(0.55 + 0.45 * eob(p, 0.9), 0.001); const c = it.pivot || [0, 0, 0];
      h.scale.set(k, k, k); h.position.set(c[0] * (1 - k), c[1] * (1 - k), c[2] * (1 - k));
    }
  }
  const n = D.night ? eo(prog(t, D.night[0], D.night[1])) : 0;
  hemi.intensity = lerp(0.35, 0.05, n); sun.intensity = lerp(1.6, 0.0, n);
  const envI = lerp(1.0, 0.12, n); materials.forEach(m => { if ("envMapIntensity" in m) m.envMapIntensity = envI; });
  H.glows.forEach(s => s.material.opacity = n * s.userData.strength);
  H.lights.forEach(l => l.intensity = n * l.userData.max);
  H.emissives.forEach(m => m.emissiveIntensity = lerp(m.userData.day, m.userData.night, n));
}

// ---------- overlap checker: lists meshes of different objects whose boxes intersect, or that poke into the walls/floor ----------
function checkOverlaps(tol = 0.012) {
  applyState(D.duration); scene.updateMatrixWorld(true);
  const list = [];
  items.forEach(it => { if (it.beforeOnly) return; it.inner.traverse(o => { if (o.isMesh && !o.userData.noCheck) list.push({ b: new THREE.Box3().setFromObject(o), obj: o.userData.obj }); }); });
  const out = [];
  for (const e of list) {
    if (e.b.min.x < -tol || e.b.min.z < -tol || e.b.min.y < -tol) out.push(`${e.obj} goes into a wall/floor: min=(${e.b.min.x.toFixed(2)},${e.b.min.y.toFixed(2)},${e.b.min.z.toFixed(2)})`);
  }
  for (let i = 0; i < list.length; i++) for (let j = i + 1; j < list.length; j++) {
    const a = list[i], b = list[j];
    if (a.obj === b.obj) continue;
    const ov = ["x", "y", "z"].map(k => Math.min(a.b.max[k], b.b.max[k]) - Math.max(a.b.min[k], b.b.min[k]));
    if (ov.every(v => v > tol)) out.push(`${a.obj} <-> ${b.obj}  overlap ${ov.map(v => v.toFixed(2)).join(" x ")}  at (${a.b.min.x.toFixed(2)}..${a.b.max.x.toFixed(2)}, ${a.b.min.y.toFixed(2)}..${a.b.max.y.toFixed(2)}, ${a.b.min.z.toFixed(2)}..${a.b.max.z.toFixed(2)})`);
  }
  return [...new Set(out)];
}
window.CHECK = checkOverlaps;

// ---------- camera (cubic Hermite through keys: [t, az, el, r, tx, ty, tz, rest?]) ----------
function camState(t) {
  const K = D.camera; let i = 0;
  while (i < K.length - 2 && t > K[i + 1][0]) i++;
  const k0 = K[i], k1 = K[i + 1], hh = k1[0] - k0[0], s = clamp((t - k0[0]) / hh);
  const tan = (j, c) => (j <= 0 || j >= K.length - 1 || K[j][7]) ? 0 : (K[j + 1][c] - K[j - 1][c]) / (K[j + 1][0] - K[j - 1][0]);
  const out = [];
  for (let c = 1; c < 7; c++) {
    const m0 = tan(i, c) * hh, m1 = tan(i + 1, c) * hh, s2 = s * s, s3 = s2 * s;
    out.push((2 * s3 - 3 * s2 + 1) * k0[c] + (s3 - 2 * s2 + s) * m0 + (-2 * s3 + 3 * s2) * k1[c] + (s3 - s2) * m1);
  }
  return out;
}

// ---------- overlay ----------
const ov = document.getElementById("ov");
ov.innerHTML = `<div class="vig"></div><div class="banner"></div><div class="title">${D.title}</div><div class="sub">${D.subtitle}</div>
  <div class="pill" id="pill"></div><div id="tags"></div>
  <div class="divider" id="div"><div class="handle">‹ ›</div></div>
  <div class="side" id="sb" style="left:50px;background:#fff;color:#0B1220">BEFORE</div>
  <div class="side" id="sa" style="right:50px;background:#FBBF24;color:#0B1220">AFTER</div>
  <div class="foot">${D.footer || ""}</div>
  <div class="end" id="end"><div class="l1">${D.endLine1 || ""}</div><div class="l2">${D.endLine2 || ""}</div><div class="btn">${D.button || "FOLLOW FOR MORE"}</div></div>`;
const tagEls = items.filter(it => it.tag).map(it => {
  const el = document.createElement("div"); el.className = "tag";
  el.innerHTML = it.tag.text + (it.tag.size ? `<small>${it.tag.size}</small>` : "");
  document.getElementById("tags").appendChild(el);
  return { el, it, pos: new THREE.Vector3(...it.tag.pos) };
});
const pillEl = document.getElementById("pill"), endEl = document.getElementById("end");
const divEl = document.getElementById("div"), sbEl = document.getElementById("sb"), saEl = document.getElementById("sa");

function sliderX(t) {
  if (!D.slider) return null;
  const [a, b] = D.slider;
  if (t < a || t > b) return null;
  const u = (t - a) / (b - a);
  const keys = [[0, 1080], [0.18, 540], [0.42, 170], [0.7, 910], [0.88, 540], [1, 540]];
  let i = 0; while (i < keys.length - 2 && u > keys[i + 1][0]) i++;
  return lerp(keys[i][1], keys[i + 1][1], eio(clamp((u - keys[i][0]) / (keys[i + 1][0] - keys[i][0]))));
}

const tmp = new THREE.Vector3();
function render(t) {
  const [az, el, r, tx, ty, tz] = camState(t);
  const A = az * Math.PI / 180, E = el * Math.PI / 180;
  camera.position.set(tx + r * Math.cos(E) * Math.sin(A), ty + r * Math.sin(E), tz + r * Math.cos(E) * Math.cos(A));
  camera.lookAt(tx, ty, tz); camera.updateMatrixWorld();

  const sx = sliderX(t);
  applyState(t);
  renderer.setScissorTest(false); renderer.render(scene, camera);
  if (sx !== null && sx > 0) {
    applyState(D.beforeAt || 0.5);
    renderer.setScissorTest(true); renderer.setScissor(0, 0, Math.round(sx), 1920);
    renderer.render(scene, camera); renderer.setScissorTest(false);
    applyState(t);
  }

  const pill = (D.pills || []).find(([a, b]) => t >= a && t < b);
  if (pill) {
    pillEl.textContent = pill[2];
    pillEl.style.opacity = Math.min(prog(t, pill[0], 0.3), 1 - prog(t, pill[1] - 0.25, 0.25));
    pillEl.style.transform = `translateX(-50%) scale(${0.8 + 0.2 * eob(prog(t, pill[0], 0.45))})`;
  } else pillEl.style.opacity = 0;

  tagEls.forEach(({ el, it, pos }) => {
    const a = it.at + (it.dur || 0.8) * 0.6, b = a + (it.tag.hold || 2.4);
    const op = Math.min(prog(t, a, 0.3), 1 - prog(t, b - 0.3, 0.3));
    if (op <= 0 || sx !== null) { el.style.opacity = 0; return; }
    tmp.copy(pos).project(camera);
    el.style.left = ((tmp.x + 1) / 2 * 1080) + "px"; el.style.top = ((1 - tmp.y) / 2 * 1920) + "px";
    el.style.opacity = op; el.style.transform = `translate(-50%,-50%) scale(${0.75 + 0.25 * eob(prog(t, a, 0.4))})`;
  });

  const so = sx === null ? 0 : 1;
  divEl.style.opacity = so; divEl.style.left = (sx || 0) + "px";
  sbEl.style.opacity = so * clamp((sx || 0) / 300); saEl.style.opacity = so * clamp((1080 - (sx || 0)) / 300);

  const ep = D.end ? eo(prog(t, D.end, 0.6)) : 0;
  endEl.style.opacity = ep; endEl.style.transform = `translateY(${(1 - ep) * 80}px)`;
}
window.render = render; window.DURATION = D.duration; window.STILLS = D.stills || [];
render(0);
</script>
