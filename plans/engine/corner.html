<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; font-family: Inter, sans-serif; background: #1a1d24; }
  #c { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  #ov { position: absolute; inset: 0; pointer-events: none; }
  .banner { position: absolute; left: 0; right: 0; top: 0; height: 330px;
    background: linear-gradient(rgba(11,18,32,.94) 0%, rgba(11,18,32,.80) 70%, rgba(11,18,32,0) 100%); }
  .title { position: absolute; top: 48px; width: 100%; text-align: center; color: #fff; font-weight: 900; font-size: 74px; letter-spacing: 1px; }
  .sub { position: absolute; top: 146px; width: 100%; text-align: center; color: #FBBF24; font-weight: 700; font-size: 31px; letter-spacing: 1px; }
  .pill { position: absolute; top: 218px; left: 50%; transform: translateX(-50%); background: #FBBF24; color: #0B1220;
    font-weight: 900; font-size: 30px; letter-spacing: 3px; padding: 7px 34px; border-radius: 30px; white-space: nowrap; }
  .tag { position: absolute; transform: translate(-50%, -50%); background: rgba(15,23,42,.9); color: #fff; font-weight: 800;
    font-size: 25px; letter-spacing: .5px; padding: 8px 18px; border-radius: 999px; white-space: nowrap; border: 2px solid rgba(251,191,36,.95); }
  .tag small { color: #FBBF24; font-weight: 700; margin-left: 8px; font-size: 22px; }
  .foot { position: absolute; bottom: 0; left: 0; right: 0; height: 70px; background: rgba(11,18,32,.75); color: #CBD5E1;
    font-size: 22px; font-weight: 500; text-align: center; line-height: 70px; }
  .divider { position: absolute; top: 330px; bottom: 70px; width: 6px; margin-left: -3px; background: #fff; box-shadow: 0 0 18px rgba(0,0,0,.6); }
  .handle { position: absolute; top: 50%; left: 50%; width: 84px; height: 84px; margin: -42px 0 0 -42px; border-radius: 50%;
    background: #fff; box-shadow: 0 6px 20px rgba(0,0,0,.5); color: #0B1220; font-weight: 900; font-size: 40px; line-height: 80px; text-align: center; }
  .side { position: absolute; bottom: 120px; font-weight: 900; font-size: 34px; letter-spacing: 3px; padding: 10px 26px; border-radius: 30px; }
  .end { position: absolute; left: 60px; right: 60px; bottom: 120px; background: rgba(11,18,32,.93); border-radius: 30px;
    padding: 40px 30px 46px; text-align: center; }
  .end .l1 { color: #FBBF24; font-weight: 900; font-size: 44px; letter-spacing: 2px; }
  .end .l2 { color: #fff; font-weight: 700; font-size: 36px; margin-top: 18px; }
  .end .btn { display: inline-block; margin-top: 30px; background: #DC2626; color: #fff; font-weight: 900; font-size: 36px;
    letter-spacing: 2px; padding: 24px 50px; border-radius: 60px; }
</style>
<script>/*THREE*/</script>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div id="ov"></div>
<script>
THREE.ColorManagement.legacyMode = false;
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const prog = (t, a, d) => clamp((t - a) / d);
const eo = x => 1 - Math.pow(1 - x, 3);
const eio = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eob = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const lerp = (a, b, k) => a + (b - a) * k;

// ---------- renderer ----------
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("c"), antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(1080, 1920, false);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.1;
const scene = new THREE.Scene();
scene.background = new THREE.Color("#1a1d24");
const camera = new THREE.PerspectiveCamera(45, 1080 / 1920, 0.2, 200);
const hemi = new THREE.HemisphereLight(0xffffff, 0x9b8b7a, 0.9); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff3e0, 1.3);
sun.position.set(14, 18, 12); sun.target.position.set(2.5, 0, 2.5); scene.add(sun, sun.target);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12, near: 1, far: 60 });
sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.02;

// ---------- helpers given to designs ----------
let seed = 7;
const rand = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
function canvasTex(w, h, draw, repeat) {
  const c = document.createElement("canvas"); c.width = w; c.height = h; draw(c.getContext("2d"), w, h);
  const tx = new THREE.CanvasTexture(c); tx.encoding = THREE.sRGBEncoding; tx.anisotropy = 4;
  if (repeat) { tx.wrapS = tx.wrapT = THREE.RepeatWrapping; tx.repeat.set(repeat[0], repeat[1]); }
  return tx;
}
function woodTex(base, dark) {
  return canvasTex(512, 512, (g, w, h) => {
    g.fillStyle = base; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 70; i++) {
      const y0 = rand() * h, amp = 2 + rand() * 6, f = 0.004 + rand() * 0.01;
      g.strokeStyle = dark; g.globalAlpha = 0.05 + rand() * 0.16; g.lineWidth = 1 + rand() * 2.5;
      g.beginPath(); for (let x = 0; x <= w; x += 8) g.lineTo(x, y0 + Math.sin(x * f + i) * amp); g.stroke();
    }
    g.globalAlpha = 1;
  });
}
const matCache = {};
const H = {
  rand,
  mat(c, extra) { const k = c + JSON.stringify(extra || {}); return matCache[k] || (matCache[k] = new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: 0.8 }, extra || {}))); },
  wood(base = "#C99A66", dark = "#7a5230") { const k = "wood" + base; return matCache[k] || (matCache[k] = new THREE.MeshStandardMaterial({ map: woodTex(base, dark), roughness: 0.65 })); },
  canvasTex,
  box(g, x1, x2, y1, y2, z1, z2, m, o) {
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(Math.max(x2 - x1, 0.005), Math.max(y2 - y1, 0.005), Math.max(z2 - z1, 0.005)), m);
    mesh.position.set((x1 + x2) / 2, (y1 + y2) / 2, (z1 + z2) / 2);
    mesh.castShadow = !(o && o.cast === false); mesh.receiveShadow = true;
    mesh.userData = { y0: mesh.position.y, h: y2 - y1 }; g.add(mesh); return mesh;
  },
  cyl(g, x, y, z, r, h, m, o = {}) {
    const mesh = new THREE.Mesh(new THREE.CylinderGeometry(o.rTop !== undefined ? o.rTop : r, r, h, o.seg || 28), m);
    if (o.axis === "x") { mesh.rotation.z = Math.PI / 2; mesh.position.set(x, y, z); }
    else if (o.axis === "z") { mesh.rotation.x = Math.PI / 2; mesh.position.set(x, y, z); }
    else mesh.position.set(x, y + h / 2, z);
    mesh.castShadow = o.cast !== false; mesh.receiveShadow = true; g.add(mesh); return mesh;
  },
  sph(g, x, y, z, r, m, sy = 1) {
    const mesh = new THREE.Mesh(new THREE.SphereGeometry(r, 22, 16), m);
    mesh.position.set(x, y, z); mesh.scale.y = sy; mesh.castShadow = true; mesh.receiveShadow = true; g.add(mesh); return mesh;
  },
  glows: [], lights: [], emissives: [],
  glowTex: canvasTex(128, 128, (g, w) => {
    const gr = g.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2);
    gr.addColorStop(0, "rgba(255,255,255,1)"); gr.addColorStop(0.25, "rgba(255,255,255,.55)"); gr.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = gr; g.fillRect(0, 0, w, w);
  }),
  // soft additive glow that fades in at night
  glow(g, x, y, z, size, color, strength = 0.9) {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: H.glowTex, color, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, opacity: 0 }));
    s.position.set(x, y, z); s.scale.set(size, size, 1); s.userData.strength = strength; g.add(s); H.glows.push(s); return s;
  },
  glowLine(g, a, b, n, size, color, strength) {
    for (let i = 0; i <= n; i++) { const k = i / n; H.glow(g, lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k), size, color, strength); }
  },
  // LED / screen material whose brightness rises at night
  led(color, day = 0.4, night = 2.2) { const m = new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: day }); m.userData = { day, night }; H.emissives.push(m); return m; },
  light(x, y, z, color, intensity, distance) { const l = new THREE.PointLight(color, 0, distance, 2); l.position.set(x, y, z); l.userData.max = intensity; scene.add(l); H.lights.push(l); return l; }
};
</script>
<script>/*DESIGN*/</script>
<script>
const D = window.CORNER;
const ROOM = Object.assign({ wall: "#E9E5DF", size: 16, height: 11 }, D.room || {});

// ---------- room ----------
const room = new THREE.Group(); scene.add(room);
const floorTex = canvasTex(1024, 1024, (g, w, h) => {
  const rows = 12, rh = h / rows;
  for (let r = 0; r < rows; r++) {
    let x = -rand() * 400;
    while (x < w) {
      const len = 260 + rand() * 300, tone = 180 + Math.floor(rand() * 30);
      g.fillStyle = `rgb(${tone + 20},${tone - 10},${tone - 50})`; g.fillRect(x, r * rh, len, rh);
      g.strokeStyle = "rgba(90,60,30,.35)"; g.lineWidth = 2; g.strokeRect(x, r * rh, len, rh);
      for (let k = 0; k < 6; k++) { g.strokeStyle = "rgba(110,75,40,.12)"; g.beginPath(); const yy = r * rh + rand() * rh; g.moveTo(x, yy); g.lineTo(x + len, yy + (rand() - 0.5) * 6); g.stroke(); }
      x += len;
    }
  }
}, [3, 3]);
H.box(room, -0.4, ROOM.size, -0.2, 0, -0.4, ROOM.size, new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.7 }), { cast: false });
const wallMat = H.mat(ROOM.wall, { roughness: 0.95 });
H.box(room, -0.4, ROOM.size, 0, ROOM.height, -0.4, 0, wallMat, { cast: false });
H.box(room, -0.4, 0, 0, ROOM.height, 0, ROOM.size, wallMat, { cast: false });
H.box(room, 0, ROOM.size, 0, 0.35, 0, 0.06, H.mat("#ffffff"), { cast: false });
H.box(room, 0, 0.06, 0, 0.35, 0, ROOM.size, H.mat("#ffffff"), { cast: false });

// ---------- items ----------
const items = D.items.map(it => {
  const holder = new THREE.Group(); const inner = new THREE.Group(); holder.add(inner); scene.add(holder);
  it.build(inner, H);
  return Object.assign({ holder, inner }, it);
});

function applyState(t) {
  for (const it of items) {
    const p = prog(t, it.at, it.dur || 0.8);
    const h = it.holder;
    if (it.beforeOnly) {
      h.visible = p < 1; const k = Math.max(1 - eo(p), 0.001); h.scale.set(k, k, k); continue;
    }
    h.visible = p > 0; if (!h.visible) continue;
    h.position.set(0, 0, 0); h.scale.set(1, 1, 1);
    const a = it.anim || "pop";
    if (a === "drop") h.position.y = (1 - eo(p)) * 5;
    else if (a === "slide") { const f = it.from || [4, 0, 0], k = 1 - eo(p); h.position.set(f[0] * k, f[1] * k, f[2] * k); }
    else if (a === "sweep") {
      const kids = it.inner.children, n = kids.length;
      kids.forEach((m, j) => {
        const pj = eo(prog(t, it.at + (j / n) * (it.dur || 0.8) * 0.8, (it.dur || 0.8) * 0.25));
        m.visible = pj > 0; m.scale.y = Math.max(pj, 0.001);
        if (m.userData.h !== undefined) m.position.y = m.userData.y0 - m.userData.h / 2 * (1 - pj);
      });
    } else {
      const k = Math.max(eob(p), 0.001); const c = it.pivot || [0, 0, 0];
      h.scale.set(k, k, k); h.position.set(c[0] * (1 - k), c[1] * (1 - k), c[2] * (1 - k));
    }
  }
  const n = D.night ? eo(prog(t, D.night[0], D.night[1])) : 0;
  hemi.intensity = lerp(0.9, 0.16, n); sun.intensity = lerp(1.3, 0.05, n);
  H.glows.forEach(s => s.material.opacity = n * s.userData.strength);
  H.lights.forEach(l => l.intensity = n * l.userData.max);
  H.emissives.forEach(m => m.emissiveIntensity = lerp(m.userData.day, m.userData.night, n));
}

// ---------- camera (cubic Hermite through keys: [t, az, el, r, tx, ty, tz, rest?]) ----------
function camState(t) {
  const K = D.camera; let i = 0;
  while (i < K.length - 2 && t > K[i + 1][0]) i++;
  const k0 = K[i], k1 = K[i + 1], hh = k1[0] - k0[0], s = clamp((t - k0[0]) / hh);
  const tan = (j, c) => (j <= 0 || j >= K.length - 1 || K[j][7]) ? 0 : (K[j + 1][c] - K[j - 1][c]) / (K[j + 1][0] - K[j - 1][0]);
  const out = [];
  for (let c = 1; c < 7; c++) {
    const m0 = tan(i, c) * hh, m1 = tan(i + 1, c) * hh, s2 = s * s, s3 = s2 * s;
    out.push((2 * s3 - 3 * s2 + 1) * k0[c] + (s3 - 2 * s2 + s) * m0 + (-2 * s3 + 3 * s2) * k1[c] + (s3 - s2) * m1);
  }
  return out;
}

// ---------- overlay ----------
const ov = document.getElementById("ov");
ov.innerHTML = `<div class="banner"></div><div class="title">${D.title}</div><div class="sub">${D.subtitle}</div>
  <div class="pill" id="pill"></div><div id="tags"></div>
  <div class="divider" id="div"><div class="handle">‹ ›</div></div>
  <div class="side" id="sb" style="left:50px;background:#fff;color:#0B1220">BEFORE</div>
  <div class="side" id="sa" style="right:50px;background:#FBBF24;color:#0B1220">AFTER</div>
  <div class="foot">${D.footer || ""}</div>
  <div class="end" id="end"><div class="l1">${D.endLine1 || ""}</div><div class="l2">${D.endLine2 || ""}</div><div class="btn">${D.button || "FOLLOW FOR MORE"}</div></div>`;
const tagEls = items.filter(it => it.tag).map(it => {
  const el = document.createElement("div"); el.className = "tag";
  el.innerHTML = it.tag.text + (it.tag.size ? `<small>${it.tag.size}</small>` : "");
  document.getElementById("tags").appendChild(el);
  return { el, it, pos: new THREE.Vector3(...it.tag.pos) };
});
const pillEl = document.getElementById("pill"), endEl = document.getElementById("end");
const divEl = document.getElementById("div"), sbEl = document.getElementById("sb"), saEl = document.getElementById("sa");

function sliderX(t) {
  if (!D.slider) return null;
  const [a, b] = D.slider;
  if (t < a || t > b) return null;
  const u = (t - a) / (b - a);
  // enter from the right, swing left and right, settle in the middle
  const keys = [[0, 1080], [0.18, 540], [0.42, 170], [0.7, 910], [0.88, 540], [1, 540]];
  let i = 0; while (i < keys.length - 2 && u > keys[i + 1][0]) i++;
  const k = eio(clamp((u - keys[i][0]) / (keys[i + 1][0] - keys[i][0])));
  return lerp(keys[i][1], keys[i + 1][1], k);
}

const tmp = new THREE.Vector3();
function render(t) {
  const [az, el, r, tx, ty, tz] = camState(t);
  const A = az * Math.PI / 180, E = el * Math.PI / 180;
  camera.position.set(tx + r * Math.cos(E) * Math.sin(A), ty + r * Math.sin(E), tz + r * Math.cos(E) * Math.cos(A));
  camera.lookAt(tx, ty, tz); camera.updateMatrixWorld();

  const sx = sliderX(t);
  applyState(t);
  renderer.setScissorTest(false); renderer.render(scene, camera);
  if (sx !== null && sx > 0) {
    applyState(D.beforeAt || 0.5);
    renderer.setScissorTest(true); renderer.setScissor(0, 0, Math.round(sx), 1920);
    renderer.render(scene, camera); renderer.setScissorTest(false);
    applyState(t);
  }

  const pill = (D.pills || []).find(([a, b]) => t >= a && t < b);
  if (pill) {
    pillEl.textContent = pill[2];
    pillEl.style.opacity = Math.min(prog(t, pill[0], 0.3), 1 - prog(t, pill[1] - 0.25, 0.25));
    pillEl.style.transform = `translateX(-50%) scale(${0.8 + 0.2 * eob(prog(t, pill[0], 0.45))})`;
  } else pillEl.style.opacity = 0;

  tagEls.forEach(({ el, it, pos }) => {
    const a = it.at + (it.dur || 0.8) * 0.6, b = a + (it.tag.hold || 2.4);
    const op = Math.min(prog(t, a, 0.3), 1 - prog(t, b - 0.3, 0.3));
    if (op <= 0 || sx !== null) { el.style.opacity = 0; return; }
    tmp.copy(pos).project(camera);
    el.style.left = ((tmp.x + 1) / 2 * 1080) + "px"; el.style.top = ((1 - tmp.y) / 2 * 1920) + "px";
    el.style.opacity = op; el.style.transform = `translate(-50%,-50%) scale(${0.7 + 0.3 * eob(prog(t, a, 0.4))})`;
  });

  const so = sx === null ? 0 : 1;
  divEl.style.opacity = so; divEl.style.left = (sx || 0) + "px";
  sbEl.style.opacity = so * clamp((sx || 0) / 300); saEl.style.opacity = so * clamp((1080 - (sx || 0)) / 300);

  const ep = D.end ? eo(prog(t, D.end, 0.6)) : 0;
  endEl.style.opacity = ep; endEl.style.transform = `translateY(${(1 - ep) * 80}px)`;
}
window.render = render; window.DURATION = D.duration; window.STILLS = D.stills || [];
render(0);
</script>
</body>
</html>
